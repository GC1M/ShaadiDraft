name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Relative base works on username.github.io/<repo>/ and later on a custom domain root, no config change.
      - run: npm run build -- --base=./
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      # IndexNow tells Bing (and Yandex, Seznam, Naver) which URLs exist, so new pages are crawled within days.
      # The key is public by design and is served from public/0f579664dcfd107af412065882ffdf85.txt.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 0f579664dcfd107af412065882ffdf85
        run: |
          urls=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -cs .)
          curl -sS -o /dev/null -w 'IndexNow %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"shaaditemplate.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://shaaditemplate.com/$KEY.txt\",\"urlList\":$urls}"
